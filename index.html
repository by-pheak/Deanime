<!DOCTYPE html>
<html lang="km">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deanime</title>
<link rel="shortcut icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBna_UFWj-tr76_1dRyF2J72GSOKHzjEnzeaYFiMxISQ&s=10" type="image/x-icon">

<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial;
}

body{
margin:0;
background:#000;
color:white;
overflow-x:hidden;
}


/* HEADER */

.header{

display:flex;
align-items:center;
gap:15px;

padding:18px;

background:rgba(20,20,20,.85);

backdrop-filter:blur(25px);

position:sticky;
top:0;

z-index:10;

animation:headerShow .8s ease;

}


@keyframes headerShow{

from{
opacity:0;
transform:translateY(-50px);
}

to{
opacity:1;
transform:translateY(0);
}

}



.logo{

width:64px;
height:64px;

border-radius:18px;

overflow:hidden;

box-shadow:0 0 25px #f0eaec;

animation:logoAnime 2s infinite alternate;

}


.logo img{

width:100%;
height:100%;

object-fit:cover;

}



@keyframes logoAnime{

from{
transform:rotate(-5deg);
box-shadow:0 0 15px #aaaaaa;
}

to{
transform:rotate(5deg);
box-shadow:0 0 40px #7b2cff;
}

}



.appname{

font-size:28px;
font-weight:900;

}


.sub{

color:#aaa;

}



/* SEARCH */


.search{

padding:20px;

}


.search input{

width:100%;

padding:15px 20px;

border:0;

outline:none;

border-radius:20px;

background:#222;

color:white;

font-size:16px;

transition:.4s;

}



.search input:focus{

transform:scale(1.04);

box-shadow:0 0 20px #b8b4b5;

}




/* ANIME LIST */


.container{

padding:20px;

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(160px,1fr));

gap:20px;

padding-bottom:100px;

}




.card{

background:#171717;

border-radius:25px;

overflow:hidden;

opacity:0;

animation:cardShow .7s forwards;

transition:.4s;

}



@keyframes cardShow{

from{

opacity:0;

transform:translateY(50px) scale(.9);

}


to{

opacity:1;

transform:translateY(0) scale(1);

}

}



.card:hover{

transform:translateY(-10px);

box-shadow:0 0 25px #6e6d6d;

}




.card img{

width:100%;

height:230px;

object-fit:cover;

transition:.5s;

}




.card:hover img{

transform:scale(1.1);

}




.info{

padding:15px;

}



.name{

font-size:18px;

font-weight:800;

}


.ep{

color:#aaa;

margin-top:5px;

}




button{

width:100%;

padding:12px;

margin-top:15px;

border:0;

border-radius:18px;

background:linear-gradient(135deg,#ff0055,#7b2cff);

color:white;

font-size:16px;

cursor:pointer;

position:relative;

overflow:hidden;

}



button:active{

transform:scale(.9);

}



button:hover{

box-shadow:0 0 20px #ff0055;

}




/* BOTTOM */


.bottom{

position:fixed;

bottom:0;

left:0;

width:100%;

padding:15px;

text-align:center;

background:rgba(20,20,20,.85);

backdrop-filter:blur(20px);

color:#aaa;

animation:bottomShow .8s;

}



@keyframes bottomShow{

from{

transform:translateY(100px);

}

to{

transform:translateY(0);

}

}


</style>

</head>
<body>


<div class="header">


<div class="logo">

<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxTbEsdFtFQo6D83kswAF26YsAtUJDDJOejipWBfCYzg&s=10">

</div>


<div>

<div class="appname">
Deanime
</div>

<div class="sub">
Anime Streaming App
</div>


</div>

</div>





<div class="search">

<input 
id="search"
placeholder="🔎 Search Anime..."
onkeyup="searchAnime()">

</div>





<div class="container" id="animeList">


</div>





<div class="bottom">

Welcome to my website....👓🖼

</div>







<script>


let anime=[


{

name:"ក្មេងប្រុសមហារសំណាង",

ep:"(មួយរឿងពេញ)",

url:"https://www.youtube.com/watch?v=oi8xUxY7Xng"

},



{

name:"ផ្ដើមស្នេហ៍ចេញពីការលេងកីឡា",

ep:"(មួយរឿងពេញ) Season 1",

url:"https://www.youtube.com/watch?v=wjzoa7JplWs"

},



{

name:"មន្តស្នេហ៍បុរសគុណភាព",

ep:"(មួយរឿងពេញ) Season 1",

url:"https://www.youtube.com/watch?v=nBhmJabL1_k"

},



{

name:"វិរបុរសក្បាលរណា កម្ចាត់បិសាច",

ep:"(មួយរឿងពេញ)",

url:"https://www.youtube.com/watch?v=ne-CjwM2hoY"

},



{

name:"វិរបុរសក្បាលរណា កម្ចាត់បិសាច",

ep:"(Movie Reze ARC)",

url:"https://www.youtube.com/watch?v=1q7D-GcL8dg"

},



{

name:"ជំនួយការខ្ញុំជាព្រះនាងនៃតារា",

ep:"(មួយរឿងពេញ)",

url:"https://www.youtube.com/watch?v=HolcisS8Ljw"

},



{

name:"Horimiya(Anime) របស់ជប៊ុន",

ep:"Season 1",

url:"https://www.youtube.com/watch?v=netqA36Szp0"

}



];






function getYoutubeID(url){


if(url.includes("watch?v=")){

return url.split("watch?v=")[1].split("&")[0];

}


if(url.includes("youtu.be/")){

return url.split("youtu.be/")[1];

}


return "";

}








function loadAnime(){


let box=document.getElementById("animeList");


box.innerHTML="";



anime.forEach((a,index)=>{


let id=getYoutubeID(a.url);



let img=id

?
"https://img.youtube.com/vi/"+id+"/maxresdefault.jpg"

:

"https://via.placeholder.com/300x400?text=Anime";






box.innerHTML +=`


<div class="card" 
style="animation-delay:${index*0.15}s">


<img src="${img}">



<div class="info">


<div class="name">

${a.name}

</div>



<div class="ep">

${a.ep}

</div>



<button onclick="openVideo('${a.url}')">

▶ Watch Now

</button>



</div>


</div>



`;



});


}







function openVideo(link){


window.open(link,"_blank");


}








function searchAnime(){


let text=document

.getElementById("search")

.value

.toLowerCase();




document.querySelectorAll(".card")

.forEach(card=>{


let name=card

.querySelector(".name")

.innerText

.toLowerCase();




if(name.includes(text)){


card.style.display="block";


}

else{


card.style.display="none";


}


});


}







loadAnime();



</script>


</body>

</html>
