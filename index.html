<!DOCTYPE html>
<html lang="km">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deanime</title>

<link rel="shortcut icon"
href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBna_UFWj-tr76_1dRyF2J72GSOKHzjEnzeaYFiMxISQ&s=10">

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}

body{
background:#000;
color:#fff;
overflow-x:hidden;
}

/* ================= HEADER ================= */

.header{
position:sticky;
top:0;
z-index:100;
display:flex;
align-items:center;
gap:15px;
padding:18px;
background:rgba(15,15,15,.85);
backdrop-filter:blur(25px);
border-bottom:1px solid rgba(255,255,255,.05);
animation:headerShow .8s;
}

@keyframes headerShow{
from{
opacity:0;
transform:translateY(-50px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.logo{
width:65px;
height:65px;
border-radius:18px;
overflow:hidden;
box-shadow:0 0 20px #ffffff55;
animation:logoAnime 2s infinite alternate;
}

.logo img{
width:100%;
height:100%;
object-fit:cover;
}

@keyframes logoAnime{
from{
transform:rotate(-5deg);
box-shadow:0 0 15px #ffffff88;
}
to{
transform:rotate(5deg);
box-shadow:0 0 35px #7b2cff;
}
}

.appname{
font-size:28px;
font-weight:900;
}

.sub{
color:#aaa;
font-size:14px;
margin-top:4px;
}

/* RIGHT BUTTON */

.header-right{
margin-left:auto;
display:flex;
gap:10px;
}

.social-btn{
width:46px;
height:46px;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
font-size:20px;
color:white;
transition:.35s;
box-shadow:0 0 15px rgba(255,255,255,.1);
}

.fb{
background:linear-gradient(135deg,#1877F2,#0d5eff);
}

.tiktok{
background:linear-gradient(135deg,#000,#ff0050,#00f2ea);
}

.social-btn:hover{
transform:translateY(-4px) scale(1.08);
box-shadow:0 0 30px #7b2cff;
}

/* ================= SEARCH ================= */

.search{
padding:20px;
}

.search input{
width:100%;
padding:15px 20px;
border:none;
outline:none;
border-radius:20px;
background:#202020;
color:#fff;
font-size:16px;
transition:.4s;
}

.search input:focus{
transform:scale(1.03);
box-shadow:0 0 20px #7b2cff;
}

/* ================= LIST ================= */

.container{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:20px;
padding-bottom:120px;
}

.card{
background:#171717;
border-radius:22px;
overflow:hidden;
transition:.4s;
opacity:0;
animation:cardShow .6s forwards;
}

@keyframes cardShow{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 0 25px #7b2cff;
}

.card img{
width:100%;
height:240px;
object-fit:cover;
transition:.5s;
}

.card:hover img{
transform:scale(1.08);
}

.info{
padding:15px;
}

.name{
font-size:18px;
font-weight:800;
line-height:1.4;
}

.ep{
margin-top:5px;
color:#aaa;
font-size:14px;
}

/* BUTTON */

.watch-btn{
width:100%;
margin-top:15px;
padding:12px;
border:none;
border-radius:18px;
cursor:pointer;
font-size:16px;
font-weight:bold;
color:white;
background:linear-gradient(135deg,#ff0055,#7b2cff);
transition:.3s;
}

.watch-btn:hover{
box-shadow:0 0 25px #ff0055;
transform:translateY(-2px);
}

.watch-btn:active{
transform:scale(.95);
}

/* FOOTER */

.bottom{
position:fixed;
left:0;
bottom:0;
width:100%;
padding:15px;
text-align:center;
background:rgba(20,20,20,.85);
backdrop-filter:blur(20px);
color:#aaa;
}

/* MOBILE */

@media(max-width:600px){

.logo{
width:55px;
height:55px;
}

.appname{
font-size:22px;
}

.social-btn{
width:42px;
height:42px;
}

}

</style>

</head>

<body>

<div class="header">

<div class="logo">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxTbEsdFtFQo6D83kswAF26YsAtUJDDJOejipWBfCYzg&s=10">
</div>

<div>
<div class="appname">Deanime</div>
<div class="sub">Anime Streaming App</div>
</div>

<div class="header-right">

<a href="https://www.facebook.com/C.I.D000007"
target="_blank"
class="social-btn fb">
<i class="fab fa-facebook-f"></i>
</a>

<a href="https://www.tiktok.com/@chim.kompheak?is_from_webapp=1&sender_device=pc"
target="_blank"
class="social-btn tiktok">
<i class="fab fa-tiktok"></i>
</a>

</div>

</div>

<div class="search">

<input
id="search"
placeholder="🔎 Search Anime..."
onkeyup="searchAnime()">

</div>

<div class="container" id="animeList">

</div>

<div class="bottom">
Welcome to my website....👓🖼
</div>

<script>
    let anime=[

{
name:"ក្មេងប្រុសមហារសំណាង",
ep:"(មួយរឿងពេញ)",
url:"https://www.youtube.com/watch?v=oi8xUxY7Xng"
},

{
name:"ផ្ដើមស្នេហ៍ចេញពីការលេងកីឡា",
ep:"(មួយរឿងពេញ) Season 1",
url:"https://www.youtube.com/watch?v=wjzoa7JplWs"
},

{
name:"មន្តស្នេហ៍បុរសគុណភាព",
ep:"(មួយរឿងពេញ) Season 1",
url:"https://www.youtube.com/watch?v=nBhmJabL1_k"
},

{
name:"វិរបុរសក្បាលរណា កម្ចាត់បិសាច",
ep:"(មួយរឿងពេញ)",
url:"https://www.youtube.com/watch?v=ne-CjwM2hoY"
},

{
name:"វិរបុរសក្បាលរណា កម្ចាត់បិសាច",
ep:"Movie Reze ARC",
url:"https://www.youtube.com/watch?v=1q7D-GcL8dg"
},

{
name:"ជំនួយការខ្ញុំជាព្រះនាងនៃតារា",
ep:"(មួយរឿងពេញ)",
url:"https://www.youtube.com/watch?v=HolcisS8Ljw"
},

{
name:"Horimiya",
ep:"Season 1",
url:"https://www.youtube.com/watch?v=netqA36Szp0"
},

{
name:"កំពូលវីរៈបុរសបែកថ្នាំស្វែងរកសេចក្ដីស្លាប់",
ep:"មួយរឿងពេញ",
url:"https://www.youtube.com/watch?v=kAwHSPaHvJE"
}

];

function getYoutubeID(url){

if(url.includes("watch?v=")){
return url.split("watch?v=")[1].split("&")[0];
}

if(url.includes("youtu.be/")){
return url.split("youtu.be/")[1];
}

return "";

}

function loadAnime(){

const box=document.getElementById("animeList");

box.innerHTML="";

anime.forEach((a,index)=>{

const id=getYoutubeID(a.url);

const img=id
? "https://img.youtube.com/vi/"+id+"/maxresdefault.jpg"
: "https://via.placeholder.com/300x400?text=Anime";

box.innerHTML+=`

<div class="card" style="animation-delay:${index*0.12}s">

<img src="${img}" loading="lazy">

<div class="info">

<div class="name">${a.name}</div>

<div class="ep">${a.ep}</div>

<button class="watch-btn"
onclick="openVideo('${a.url}')">

▶ Watch Now

</button>

</div>

</div>

`;

});

}

function openVideo(link){

window.open(link,"_blank");

}

function searchAnime(){

const text=document
.getElementById("search")
.value
.toLowerCase();

document
.querySelectorAll(".card")
.forEach(card=>{

const name=card
.querySelector(".name")
.innerText
.toLowerCase();

card.style.display=
name.includes(text)
? "block"
: "none";

});

}

loadAnime();

/* ========= Extra Animation ========= */

window.addEventListener("load",()=>{

document.body.animate(

[
{opacity:0},
{opacity:1}
],
{
duration:700,
fill:"forwards"
}

);

});

/* ========= Enter Search ========= */

document
.getElementById("search")
.addEventListener("keypress",function(e){

if(e.key==="Enter"){

searchAnime();

}

});

/* ========= Welcome ========= */

console.log("Deanime Loaded Successfully!");

</script>

</body>

</html>
